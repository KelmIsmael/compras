    <script>
        function adjustQuantity(quantityId, adjustment) {
            const quantityElement = document.getElementById(quantityId + '-display');
            let currentQuantity = parseInt(quantityElement.innerText);
            currentQuantity += adjustment;

            // Asegura que la cantidad no sea menor a 1
            if (currentQuantity < 1) {
                currentQuantity = 1;
            }

            quantityElement.innerText = currentQuantity;
        }

        function addToCart(productName, price, quantityId) {
            const quantity = document.getElementById(quantityId + '-display').innerText;
            alert(`${productName} x${quantity} agregado al carrito. Total: $${price * quantity}`);
        }
    </script>
